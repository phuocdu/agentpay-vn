[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpay"]

[project]
name = "agentpay-vn"
version = "0.1.0"
description = "VietQR payment infrastructure for AI agents — AgentPay VN MCP server & Python SDK"
keywords = ["vietqr", "mcp", "model-context-protocol", "ai-agents", "payments", "vietnam", "claude", "fintech", "sepay"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ServicesAI", email = "servicesai@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.0",
]

[project.scripts]
agentpay-mcp = "agentpay.mcp_server:main"

[project.urls]
Homepage = "https://agentpay.servicesai.vn"
Documentation = "https://github.com/phuocdu/agentpay-vn#readme"
Repository = "https://github.com/phuocdu/agentpay-vn"
Issues = "https://github.com/phuocdu/agentpay-vn/issues"
