[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpay-vn"
version = "0.1.0"
description = "VietQR payment infrastructure for AI agents — AgentPay VN MCP server & Python SDK"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.0",
]

[project.scripts]
agentpay-mcp = "agentpay.mcp_server:main"

[project.urls]
Homepage = "https://agentpay.servicesai.vn"
Documentation = "https://github.com/drave-io/agentpay-vn"
